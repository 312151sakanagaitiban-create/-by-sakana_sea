<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>タスク管理</title>

<!-- iOS ホーム画面追加対応 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タスク管理">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">

<!-- PWA マニフェスト（サーバー配信時に有効） -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --text: #14161a;
    --text-muted: #7b7f89;
    --accent: #4f46e5;
    --accent-soft: #eceafd;
    --danger: #e5484d;
    --border: #e6e7eb;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #f1f2f4;
      --text-muted: #92959e;
      --accent: #818cf8;
      --accent-soft: #262a3a;
      --danger: #f87171;
      --border: #2a2d35;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    overscroll-behavior-y: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  header {
    padding: calc(14px + var(--safe-top)) 20px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
  }

  header .count {
    margin-top: 2px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .toolbar {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toolbar label {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #sort-select {
    font-size: 13px;
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    outline: none;
  }

  main {
    flex: 1;
    padding: 16px 16px calc(96px + var(--safe-bottom));
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.task {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    animation: fadeIn 0.18s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .checkbox {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    cursor: pointer;
  }

  .checkbox.checked {
    background: var(--accent);
  }

  .checkbox svg {
    width: 15px;
    height: 15px;
    opacity: 0;
  }

  .checkbox.checked svg {
    opacity: 1;
  }

  .task-body {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }

  .task-text {
    font-size: 16px;
    line-height: 1.4;
    word-break: break-word;
  }

  li.done .task-text {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .due-date {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .due-date.overdue {
    color: var(--danger);
    font-weight: 600;
  }

  .delete-btn {
    flex: none;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .delete-btn:active {
    background: rgba(229, 72, 77, 0.12);
    color: var(--danger);
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-size: 15px;
  }

  form#add-form {
    position: fixed;
    left: 0;
    right: 0;
    bottom: var(--kb-offset, 0px);
    padding: 12px 16px calc(14px + var(--safe-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  .input-bar {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }

  .input-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #task-input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 16px;
    color: var(--text);
    outline: none;
    min-width: 0;
    padding: 8px 4px;
  }

  #task-input::placeholder {
    color: var(--text-muted);
  }

  .due-picker {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 8px 10px;
  }

  .due-picker .due-icon {
    flex: none;
    font-size: 15px;
    line-height: 1;
  }

  .due-picker .due-label {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .due-picker .due-label.has-value {
    color: var(--text);
    font-weight: 600;
  }

  .due-native-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: none;
    opacity: 0;
    cursor: pointer;
  }

  #add-btn {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #add-btn:active {
    opacity: 0.8;
  }
</style>
</head>
<body>

<header>
  <h1>タスク管理</h1>
  <div class="count" id="count-label">タスクはありません</div>
  <div class="toolbar">
    <label for="sort-select">
      並び替え
      <select id="sort-select">
        <option value="created">追加順</option>
        <option value="due">期限が近い順</option>
      </select>
    </label>
  </div>
</header>

<main>
  <ul id="list"></ul>
  <div class="empty-state" id="empty-state" hidden>タスクを追加してみましょう</div>
</main>

<form id="add-form">
  <div class="input-bar">
    <div class="input-bar-row">
      <input id="task-input" type="text" placeholder="新しいタスクを入力" autocomplete="off" maxlength="200">
    </div>
    <div class="input-bar-row">
      <div class="due-picker" id="due-picker">
        <span class="due-icon" aria-hidden="true">⏰</span>
        <span class="due-label" id="due-label">期限を設定</span>
        <input id="due-input" class="due-native-input" type="date" aria-label="期限を設定">
      </div>
      <button id="add-btn" type="submit" aria-label="追加">＋</button>
    </div>
  </div>
</form>

<script>
(() => {
  const STORAGE_KEY = "simple-task-app.tasks";

  const listEl = document.getElementById("list");
  const formEl = document.getElementById("add-form");
  const inputEl = document.getElementById("task-input");
  const dueInputEl = document.getElementById("due-input");
  const dueLabelEl = document.getElementById("due-label");
  const sortSelectEl = document.getElementById("sort-select");
  const DUE_PLACEHOLDER = "期限を設定";
  const countLabel = document.getElementById("count-label");
  const emptyState = document.getElementById("empty-state");

  let sortMode = "created";

  const todayStr = () => {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${m}-${day}`;
  };

  const formatDue = (dueDate) => {
    const [y, m, d] = dueDate.split("-");
    return `期限: ${y}/${Number(m)}/${Number(d)}`;
  };

  const shortDate = (dueDate) => {
    const [, m, d] = dueDate.split("-");
    return `${Number(m)}/${Number(d)}`;
  };

  const updateDueLabel = () => {
    if (dueInputEl.value) {
      dueLabelEl.textContent = shortDate(dueInputEl.value);
      dueLabelEl.classList.add("has-value");
    } else {
      dueLabelEl.textContent = DUE_PLACEHOLDER;
      dueLabelEl.classList.remove("has-value");
    }
  };

  const loadTasks = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  };

  const saveTasks = (tasks) => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  };

  let tasks = loadTasks();

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const checkIconSvg = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M5 12.5L9.5 17L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  const trashIconSvg = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M9 7V4.5C9 4.22 9.22 4 9.5 4H14.5C14.78 4 15 4.22 15 4.5V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 7L7 19.5C7.05 20.33 7.73 21 8.5 21H15.5C16.27 21 16.95 20.33 17 19.5L18 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>`;

  function getSortedTasks() {
    if (sortMode !== "due") return tasks;

    return [...tasks].sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    });
  }

  function render() {
    listEl.innerHTML = "";

    if (tasks.length === 0) {
      emptyState.hidden = false;
    } else {
      emptyState.hidden = true;
    }

    const today = todayStr();

    for (const task of getSortedTasks()) {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");
      li.dataset.id = task.id;

      const checkbox = document.createElement("button");
      checkbox.type = "button";
      checkbox.className = "checkbox" + (task.done ? " checked" : "");
      checkbox.setAttribute("aria-label", task.done ? "未完了に戻す" : "完了にする");
      checkbox.innerHTML = checkIconSvg;
      checkbox.addEventListener("click", () => toggleTask(task.id));

      const body = document.createElement("div");
      body.className = "task-body";
      body.addEventListener("click", () => toggleTask(task.id));

      const text = document.createElement("div");
      text.className = "task-text";
      text.textContent = task.text;
      body.appendChild(text);

      if (task.dueDate) {
        const isOverdue = !task.done && task.dueDate <= today;
        const due = document.createElement("div");
        due.className = "due-date" + (isOverdue ? " overdue" : "");
        due.textContent = formatDue(task.dueDate);
        body.appendChild(due);
      }

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete-btn";
      del.setAttribute("aria-label", "削除");
      del.innerHTML = trashIconSvg;
      del.addEventListener("click", () => deleteTask(task.id));

      li.appendChild(checkbox);
      li.appendChild(body);
      li.appendChild(del);
      listEl.appendChild(li);
    }

    const remaining = tasks.filter((t) => !t.done).length;
    if (tasks.length === 0) {
      countLabel.textContent = "タスクはありません";
    } else {
      countLabel.textContent = `残り ${remaining} / 全 ${tasks.length} 件`;
    }
  }

  function addTask(text, dueDate) {
    const trimmed = text.trim();
    if (!trimmed) return;
    tasks.unshift({
      id: uid(),
      text: trimmed,
      done: false,
      dueDate: dueDate || null,
      createdAt: Date.now()
    });
    saveTasks(tasks);
    render();
  }

  function toggleTask(id) {
    const task = tasks.find((t) => t.id === id);
    if (!task) return;
    task.done = !task.done;
    saveTasks(tasks);
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter((t) => t.id !== id);
    saveTasks(tasks);
    render();
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    addTask(inputEl.value, dueInputEl.value);
    inputEl.value = "";
    dueInputEl.value = "";
    updateDueLabel();
    inputEl.focus();
  });

  dueInputEl.addEventListener("change", updateDueLabel);

  sortSelectEl.addEventListener("change", () => {
    sortMode = sortSelectEl.value;
    render();
  });

  render();

  // iOS Safari はキーボード表示時にレイアウトビューポートを縮めず、
  // 見た目のビューポート（visualViewport）だけを縮める。
  // position: fixed の要素をキーボードの直上に追従させ、画面全体が跳ねるのを防ぐ。
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const syncKeyboardOffset = () => {
      const offset = Math.max(window.innerHeight - vv.height - vv.offsetTop, 0);
      document.documentElement.style.setProperty("--kb-offset", `${offset}px`);
    };
    vv.addEventListener("resize", syncKeyboardOffset);
    vv.addEventListener("scroll", syncKeyboardOffset);
    syncKeyboardOffset();
  }

  // Service Worker はサーバー経由（http/https）で開いた場合のみ登録する
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
})();
</script>

</body>
</html>
